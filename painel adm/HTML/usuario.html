<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário • CitySync</title>
    <link rel="stylesheet" href="/CSS/user.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>CitySync</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="gestao.html" class="nav-item">
                    <i class="fa-solid fa-file-alt"></i>
                    <span>Reports</span>
                </a>
                <a href="usuario.html" class="nav-item active">
                    <i class="fa-solid fa-user"></i>
                    <span>Usuário</span>
                </a>
                <a href="configuracoes.html" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Configurações</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="index.html" class="logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sair</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <h1>Perfil do Usuário</h1>
                <div class="user-profile">
                    <i class="fas fa-user-circle profile-avatar"></i>
                    <span class="profile-name">Iwin Lima</span>
                </div>
            </header>

            <div class="profile-section">
                <section class="profile-card">
                    <i class="fa-solid fa-user-circle avatar profile-avatar-lg"></i>
                    <h2>Iwin Lima Borges</h2>
                    <p class="role">Administrador</p>
                    <div class="profile-links">
                        <a href="#" class="profile-link"><i class="fa-solid fa-envelope"></i></a>
                        <a href="#" class="profile-link"><i class="fa-solid fa-phone"></i></a>
                        <a href="#" class="profile-link"><i class="fa-solid fa-location-dot"></i></a>
                    </div>
                </section>

                <section class="profile-details">
                    <h3>Informações Pessoais</h3>
                    <form>
                        <div class="form-group">
                            <label for="name">Nome:</label>
                            <input type="text" id="name" value="Iwin Lima Borges">
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail:</label>
                            <input type="email" id="email" value="iwin@email.com">
                        </div>

                        <div class="form-group">
                            <label for="password">Senha:</label>
                            <input type="password" id="password" value="********">
                        </div>

                        <button type="submit" class="btn-save">Salvar Alterações</button>
                    </form>
                </section>
            </div>
        </main>
    </div>
    <script src="/Javascript/darkmode.js"></script>
</body>
</html>
